condition = "AND"
paths = ['''^services/blockbook/bchain/coins/nuls/nulsparser_test\.go$''']
regexTarget = "secret"
regexes = ['''^0x995c98115809359eb57a5e179558faddd55ef88f88e5cf58617a5f9f3d6bb3a1$''', '''^0x0f65dee42d3c974c1a4bcc79f141be89715dc8d6406faa9ad4f1f55ca95fabc8$''', '''^0x6fd98d1d9c3f3ac1ff61bbf3f20e89f00ffa8d43a554f2a7d73fd464b6666f45$''', '''^0x21412d9e33aba493faf4bc7d408ed5290bea5b36a7beec554b858051f8d4bff3$''', '''^0xdc3d290e32a4e0f38bc26c25a78ceb1c8779110883d9cb0be54629043c1f8724$''']

