name: Android security checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-security:
    name: Native storage and authentication (Android 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Android test tools
        run: |
          "${ANDROID_HOME:?Android SDK root is required}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'emulator' 'build-tools;35.0.0' 'platforms;android-35' 'system-images;android-35;google_apis;x86_64'
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Build disposable QA app and instrumentation
        working-directory: whippet/android
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?Java 17 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Check runner safety guards
        run: python3 -m unittest scripts.tests.test_android_security -v
      - name: Run isolated native security scenarios
        run: python3 scripts/android_security.py
