name: Wallet and packaging checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact event commit (public repository)
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check offline recovery and wallet backup compatibility
        run: |
          node recovery/tests.cjs
          python3 recovery/package.py /tmp/whippet-recovery.zip
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: python3 scripts/check-public-tree.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: docker compose --env-file infra/.env.example -f infra/compose.yaml config --quiet
      - name: Scan published source for secrets
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --config=/repo/.gitleaks.toml
