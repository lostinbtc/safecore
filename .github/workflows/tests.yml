name: Wallet and packaging checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  wallet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact event commit (private or public repository)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Check offline recovery and wallet backup compatibility
        run: |
          node recovery/tests.cjs
          python3 recovery/package.py /tmp/safecore-recovery.zip
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - run: python3 scripts/check-public-tree.py
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Exercise signature gate with disposable APKs and signing keys
        run: |
          "${ANDROID_HOME:?Android SDK root is required}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'build-tools;35.0.1' 'platforms;android-35'
          SAFECORE_APK_INTEGRATION=1 python3 -m unittest scripts.tests.test_apk_security_integration -v
      - run: docker compose --env-file infra/.env.example -f infra/compose.yaml config --quiet
      - name: Scan published source for secrets
        run: |
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --config=/repo/.gitleaks.toml
